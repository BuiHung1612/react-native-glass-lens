name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package:
    name: Package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate package.json
        run: node -e "const p=require('./package.json'); if(!p.codegenConfig||!p.files) process.exit(1)"
      - name: Pack (dry run)
        run: npm pack --dry-run
